name: Build and release Hotspot Pistolwhip'd 0.1.0

on:
  push:
    branches: [phase-1-foundation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-1-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hotspot-Pistolwhipd-v0.1.0-debug.apk
      - name: Preserve APK as a build artifact for verification
        uses: actions/upload-artifact@v4
        with:
          name: Hotspot-Pistolwhipd-v0.1.0-debug
          path: Hotspot-Pistolwhipd-v0.1.0-debug.apk
          retention-days: 14
      - name: Publish immutable test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: ${{ github.sha }}
          name: Hotspot Pistolwhip'd v0.1.0 — Phase 1 Prototype
          prerelease: true
          fail_on_unmatched_files: true
          files: Hotspot-Pistolwhipd-v0.1.0-debug.apk
          make_latest: false
          body: |
            Phase 1 clean-room prototype.
            Includes independent Share/Receive controls, a multi-client SOCKS5 listener and receiver-side Wi-Fi gateway/endpoint health check.
            **Not a complete internet tunnel:** VPN packet forwarding is deferred to Phase 2.
            Debug-signed sideload build; not a production or Play Store release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
